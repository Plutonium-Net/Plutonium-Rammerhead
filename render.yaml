# Render Blueprint (free plan). Deploy with: New + > Blueprint, point at this repo.
# The client bundles are gitignored, so the build step must run before start.
services:
  - type: web
    name: rammerhead
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    # /returns 200; the root path now returns 401 (JSON) without params.
    healthCheckPath: /needpassword
