# Render Blueprint (free plan). Deploy with: New + > Blueprint, point at this repo.
# The client bundles are gitignored, so the build step must run before start.
services:
  - type: web
    name: rammerhead
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    # stable endpoint that always returns 200
    healthCheckPath: /needpassword
